<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
  <rect width="1100" height="540" fill="#111009"/>

  <text x="550" y="42" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="bold" fill="#E8E4D8" letter-spacing="4">MAKING THEM BEATABLE</text>
  <text x="550" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" fill="#6A6358">harder bots see the truth; easier bots react to a stale, noisy ghost of where you were</text>

  <line x1="560" y1="96" x2="560" y2="452" stroke="#3D3A30" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ============ LEFT: true vs ghost ============ -->
  <text x="290" y="128" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#9A9484" letter-spacing="2">WHAT THE BOT ACTS ON</text>

  <!-- motion path of the real player -->
  <path d="M120,330 C 200,250 300,250 380,300 C 430,330 470,330 500,320"
        fill="none" stroke="#2C2A22" stroke-width="2" stroke-dasharray="3,4"/>

  <!-- true position (bright) -->
  <circle cx="500" cy="320" r="15" fill="#C47A5A"/>
  <text x="500" y="356" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#C47A5A">TRUE (now)</text>

  <!-- ghost position: earlier on the path + noise scatter -->
  <circle cx="372" cy="296" r="15" fill="#C47A5A" fill-opacity="0.28" stroke="#C47A5A" stroke-opacity="0.5" stroke-dasharray="3,3"/>
  <g fill="#C47A5A" fill-opacity="0.5">
    <circle cx="356" cy="284" r="2.5"/><circle cx="388" cy="282" r="2.5"/>
    <circle cx="364" cy="312" r="2.5"/><circle cx="386" cy="308" r="2.5"/>
  </g>
  <text x="372" y="346" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#9A9484">GHOST (delayed + noisy)</text>

  <!-- delay arrow between ghost and true -->
  <defs>
    <marker id="ra" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#6A6358"/>
    </marker>
  </defs>
  <line x1="388" y1="300" x2="482" y2="316" stroke="#6A6358" stroke-width="1.4" stroke-dasharray="2,3" marker-end="url(#ra)"/>
  <text x="430" y="396" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#6A6358">up to ~12 frames behind + position noise</text>

  <!-- ============ RIGHT: difficulty ramp ============ -->
  <text x="800" y="128" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#9A9484" letter-spacing="2">DIFFICULTY = ONE INPUT</text>

  <!-- ramp bar -->
  <defs>
    <linearGradient id="diff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D9A6A"/>
      <stop offset="1" stop-color="#C47A5A"/>
    </linearGradient>
  </defs>
  <rect x="620" y="180" width="360" height="16" rx="8" fill="url(#diff)"/>

  <g font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#C8C0AE" text-anchor="middle">
    <text x="620" y="226">EXPERT</text>
    <text x="740" y="226">HARD</text>
    <text x="860" y="226">MEDIUM</text>
    <text x="980" y="226">EASY</text>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6A6358" text-anchor="middle">
    <text x="620" y="244">0 delay · 0 noise</text>
    <text x="980" y="244">12 frames · max noise</text>
  </g>

  <text x="800" y="300" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#C8C0AE">
    a single scalar, 0 → 1, fed in as an observation</text>
  <text x="800" y="324" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#C8C0AE">
    so the bot knows how sharp to play right now</text>
  <text x="800" y="364" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6A6358">
    trained across all tiers — pick the difficulty per match, no retrain</text>

  <text x="550" y="500" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#7D9A6A">
    they feel like opponents, not frame-perfect machines</text>
</svg>

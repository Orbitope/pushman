<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <rect width="1100" height="600" fill="#111009"/>

  <text x="550" y="42" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="bold" fill="#E8E4D8" letter-spacing="4">WHAT THE AGENT IS PAID FOR</text>
  <text x="550" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" fill="#6A6358">the final reward function — one big terminal signal, everything else a quiet nudge</text>

  <!-- column headers -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="92"  y="100" font-size="11" fill="#6A6358" letter-spacing="2">GROUP</text>
    <text x="300" y="100" font-size="11" fill="#6A6358" letter-spacing="2">SIGNAL</text>
    <text x="740" y="100" font-size="11" fill="#6A6358" letter-spacing="2" text-anchor="end">VALUE</text>
    <text x="770" y="100" font-size="11" fill="#6A6358" letter-spacing="2">WHY</text>
  </g>
  <line x1="64" y1="110" x2="1036" y2="110" stroke="#3A3830" stroke-width="0.8"/>

  <g font-family="'Segoe UI',Arial,sans-serif" font-size="13">
    <!-- TERMINAL -->
    <rect x="64" y="124" width="6" height="40" rx="3" fill="#E8C068"/>
    <text x="92" y="150" font-size="13" font-weight="bold" fill="#E8C068">TERMINAL</text>
    <text x="300" y="150" fill="#EDE8DC">win the round</text>
    <text x="740" y="150" text-anchor="end" font-weight="bold" fill="#E8C068">+10.0</text>
    <text x="770" y="150" font-size="11" fill="#9A9484">the only thing that should matter</text>
    <line x1="64" y1="176" x2="1036" y2="176" stroke="#2C2A22" stroke-width="0.6"/>

    <!-- HITS -->
    <rect x="64" y="190" width="6" height="110" rx="3" fill="#C49A3C"/>
    <text x="92" y="216" font-size="13" font-weight="bold" fill="#C49A3C">HITS</text>
    <text x="300" y="216" fill="#EDE8DC">land a push (base)</text>
    <text x="740" y="216" text-anchor="end" fill="#C8C0AE">+0.05</text>
    <text x="770" y="216" font-size="11" fill="#9A9484">a nudge — basically noise</text>
    <text x="300" y="246" fill="#EDE8DC">edge-hit bonus</text>
    <text x="740" y="246" text-anchor="end" font-weight="bold" fill="#C8C0AE">+0.50</text>
    <text x="770" y="246" font-size="11" fill="#9A9484">× how close they are to the edge</text>
    <text x="300" y="276" fill="#EDE8DC">push got blocked</text>
    <text x="740" y="276" text-anchor="end" fill="#C47A5A">−0.05</text>
    <text x="770" y="276" font-size="11" fill="#9A9484">don't throw a push into a guard</text>
    <line x1="64" y1="300" x2="1036" y2="300" stroke="#2C2A22" stroke-width="0.6"/>

    <!-- DODGE -->
    <rect x="64" y="314" width="6" height="110" rx="3" fill="#9A7AB0"/>
    <text x="92" y="340" font-size="13" font-weight="bold" fill="#9A7AB0">DODGE</text>
    <text x="300" y="340" fill="#EDE8DC">dodge an incoming hit</text>
    <text x="740" y="340" text-anchor="end" fill="#C8C0AE">+0.05</text>
    <text x="770" y="340" font-size="11" fill="#9A9484">evasion is good, not free</text>
    <text x="300" y="370" fill="#EDE8DC">dodge connects</text>
    <text x="740" y="370" text-anchor="end" fill="#C8C0AE">+0.01</text>
    <text x="770" y="370" font-size="11" fill="#9A9484">tiny — it used to rival a push</text>
    <text x="300" y="400" fill="#EDE8DC">dodge whiffed</text>
    <text x="740" y="400" text-anchor="end" fill="#C47A5A">−0.05</text>
    <text x="770" y="400" font-size="11" fill="#9A9484">so dodge-spam isn't free</text>
    <line x1="64" y1="424" x2="1036" y2="424" stroke="#2C2A22" stroke-width="0.6"/>

    <!-- SHAPING -->
    <rect x="64" y="438" width="6" height="80" rx="3" fill="#6B7A8D"/>
    <text x="92" y="464" font-size="13" font-weight="bold" fill="#9AAABB">SHAPING</text>
    <text x="300" y="464" fill="#EDE8DC">face the opponent (dot &gt; 0.5)</text>
    <text x="740" y="464" text-anchor="end" fill="#C8C0AE">×0.0001</text>
    <text x="770" y="464" font-size="11" fill="#9A9484">10× smaller — it once beat winning</text>
    <text x="300" y="494" fill="#EDE8DC">time penalty / step</text>
    <text x="740" y="494" text-anchor="end" fill="#C47A5A">−0.0001</text>
    <text x="770" y="494" font-size="11" fill="#9A9484">prefer shorter matches; end it</text>
  </g>

  <text x="550" y="556" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12"
        font-weight="bold" fill="#7D9A6A">the win is ~20× the biggest hit — so the agent optimises winning, not farming hits</text>
  <text x="550" y="580" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#4A463C">
    values from BotPersonality.cs (per-personality biases layer small deltas on top of this base)</text>
</svg>

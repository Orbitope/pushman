<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#111009"/>

  <text x="550" y="42" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="bold" fill="#E8E4D8" letter-spacing="4">WHAT THE AGENT SEES</text>
  <text x="550" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" fill="#6A6358">every number the policy reads each step, grouped — the last row is the one I forgot</text>

  <!-- rows -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <!-- SELF -->
    <g transform="translate(0,108)">
      <rect x="64" y="0" width="6" height="64" rx="3" fill="#6B7A8D"/>
      <text x="86" y="22" font-size="15" font-weight="bold" fill="#9AAABB" letter-spacing="2">SELF</text>
      <text x="86" y="46" font-size="13" fill="#C8C0AE">velocity · heading · stamina · current state · charge progress · ring-out margin</text>
      <text x="86" y="64" font-size="10.5" fill="#6A6358">where I am and what I'm doing right now</text>
    </g>
    <!-- SELF STATS -->
    <g transform="translate(0,184)">
      <rect x="64" y="0" width="6" height="64" rx="3" fill="#6B7A8D"/>
      <text x="86" y="22" font-size="15" font-weight="bold" fill="#9AAABB" letter-spacing="2">SELF · STATS</text>
      <text x="86" y="46" font-size="13" fill="#C8C0AE">weight · move speed · push force · dodge force · max stamina</text>
      <text x="86" y="64" font-size="10.5" fill="#6A6358">so one network generalises across every character variant</text>
    </g>
    <!-- IDENTITY -->
    <g transform="translate(0,260)">
      <rect x="64" y="0" width="6" height="64" rx="3" fill="#9A7AB0"/>
      <text x="86" y="22" font-size="15" font-weight="bold" fill="#9A7AB0" letter-spacing="2">IDENTITY</text>
      <text x="86" y="46" font-size="13" fill="#C8C0AE">self-personality (one-hot ×5) · difficulty / humanization tier</text>
      <text x="86" y="64" font-size="10.5" fill="#6A6358">which reward stream am I optimising, and how sharp should I play — opponent identity is deliberately NOT seen</text>
    </g>
    <!-- ARENA -->
    <g transform="translate(0,336)">
      <rect x="64" y="0" width="6" height="64" rx="3" fill="#6A6358"/>
      <text x="86" y="22" font-size="15" font-weight="bold" fill="#9A9484" letter-spacing="2">ARENA</text>
      <text x="86" y="46" font-size="13" fill="#C8C0AE">vector to centre (x, y) · ring shrink progress</text>
      <text x="86" y="64" font-size="10.5" fill="#6A6358">where the edge is — and that it's closing in</text>
    </g>
    <!-- OPPONENT -->
    <g transform="translate(0,412)">
      <rect x="64" y="0" width="6" height="64" rx="3" fill="#C47A5A"/>
      <text x="86" y="22" font-size="15" font-weight="bold" fill="#C47A5A" letter-spacing="2">OPPONENT</text>
      <text x="86" y="46" font-size="13" fill="#C8C0AE">relative position · relative velocity · state (one-hot ×6) · distance</text>
      <text x="86" y="64" font-size="10.5" fill="#6A6358">read through a reaction-lag + noise filter (see difficulty)</text>
    </g>
    <!-- AIMING (highlighted) -->
    <g transform="translate(0,492)">
      <rect x="60" y="-8" width="980" height="84" rx="6" fill="#1E1C16" stroke="#C49A3C" stroke-width="1.2"/>
      <rect x="64" y="0" width="6" height="64" rx="3" fill="#C49A3C"/>
      <text x="86" y="22" font-size="15" font-weight="bold" fill="#E8C068" letter-spacing="2">AIMING</text>
      <text x="900" y="22" text-anchor="end" font-size="11" font-weight="bold" fill="#C49A3C" letter-spacing="1">ADDED LATER — THE FIX</text>
      <text x="86" y="46" font-size="13" fill="#EDE8DC">am I pointed at the opponent? (dot) · is the opponent pointed at me? (dot)</text>
      <text x="86" y="64" font-size="10.5" fill="#9A9484">two pre-computed dot products — the trig the tiny network could never learn on its own</text>
    </g>
  </g>

  <text x="550" y="618" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="10" fill="#4A463C">grouped from RLAgentBrain.CollectObservations — counts vary by profile (≈33 dims with aiming on)</text>
</svg>

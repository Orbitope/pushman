<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#111009"/>

  <text x="550" y="42" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="bold" fill="#E8E4D8" letter-spacing="4">THE NUMBER I FORGOT TO GIVE IT</text>
  <text x="550" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" fill="#6A6358">a push only lands in a ~70° cone in front of you — so the agent has to know if it's aimed</text>

  <!-- divider -->
  <line x1="560" y1="96" x2="560" y2="572" stroke="#3D3A30" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ===================== LEFT: the geometry ===================== -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#EDE8DC"/>
    </marker>
    <marker id="ahG" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7D9A6A"/>
    </marker>
    <marker id="ahC" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FF5E3A"/>
    </marker>
  </defs>

  <!-- push cone (~70°) around facing -->
  <polygon points="300,380 262,183 472,277" fill="#C49A3C" fill-opacity="0.10" stroke="#C49A3C" stroke-opacity="0.5" stroke-width="1"/>
  <text x="360" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#C49A3C">~70° push window</text>

  <!-- facing arrow (transform.up) -->
  <line x1="300" y1="380" x2="362" y2="240" stroke="#EDE8DC" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="372" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#C8C0AE">my facing  (transform.up)</text>

  <!-- self bot -->
  <circle cx="300" cy="380" r="16" fill="#6B7A8D"/>
  <text x="300" y="416" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#9AAABB">SELF</text>

  <!-- vector to opponent A (inside cone, nudged off the facing axis for clarity) -->
  <line x1="300" y1="380" x2="333" y2="252" stroke="#7D9A6A" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ahG)"/>
  <circle cx="331" cy="250" r="13" fill="#C47A5A"/>
  <text x="352" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#7D9A6A">dot ≈ 0.95   ✓ lands</text>

  <!-- vector to opponent B (off to the side) -->
  <line x1="300" y1="380" x2="462" y2="404" stroke="#FF5E3A" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ahC)"/>
  <circle cx="468" cy="406" r="13" fill="#5A4A42"/>
  <text x="486" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#FF5E3A">dot ≈ 0.28   ✗ whiffs</text>

  <!-- dot product caption -->
  <text x="300" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#EDE8DC">
    <tspan font-weight="bold">facing · directionToOpponent</tspan>  =  how aimed I am</text>
  <text x="300" y="514" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#9A9484">
    1.0 = dead-on · 0 = sideways · the agent's whole aim problem in one number</text>

  <!-- ===================== RIGHT: why it couldn't ===================== -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="800" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#FF5E3A" letter-spacing="2">WHY THE NETWORK COULDN'T</text>

    <!-- it had -->
    <rect x="600" y="150" width="400" height="74" rx="6" fill="#1E1C16" stroke="#3D3A30" stroke-width="1"/>
    <text x="616" y="174" font-size="11" fill="#6A6358" letter-spacing="2">IT HAD</text>
    <text x="616" y="200" font-size="13" fill="#C8C0AE">my rotation angle  θ</text>
    <text x="616" y="216" font-size="13" fill="#C8C0AE">opponent position  (x, y)</text>

    <!-- it needed -->
    <rect x="600" y="240" width="400" height="58" rx="6" fill="#1E1C16" stroke="#3D3A30" stroke-width="1"/>
    <text x="616" y="264" font-size="11" fill="#6A6358" letter-spacing="2">IT NEEDED</text>
    <text x="616" y="288" font-size="13" fill="#C8C0AE">am I aimed at them?  yes / no</text>

    <!-- the gap -->
    <text x="800" y="338" text-anchor="middle" font-size="13" fill="#EDE8DC">so it had to derive, on its own:</text>
    <text x="800" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#C47A5A">cos( θ − atan2(Δy, Δx) )</text>
    <text x="800" y="394" text-anchor="middle" font-size="12" fill="#FF5E3A">trigonometry, from scratch, in a handful of neurons — it never did</text>

    <!-- the fix -->
    <rect x="600" y="430" width="400" height="92" rx="6" fill="#1E1C16" stroke="#C49A3C" stroke-width="1.4"/>
    <text x="616" y="456" font-size="11" fill="#C49A3C" letter-spacing="2">THE FIX</text>
    <text x="616" y="484" font-size="14" font-weight="bold" fill="#E8C068">compute the dot product myself</text>
    <text x="616" y="506" font-size="12" fill="#C8C0AE">and hand it over as one input — the next model aimed</text>
  </g>

  <text x="550" y="598" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#4A463C">
    the obs is literally Vector2.Dot(transform.up, dirToOpp) — don't make a small net learn the trig you can just precompute</text>
</svg>

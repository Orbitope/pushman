<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
  <!-- Background -->
  <rect width="1100" height="540" fill="#111009"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="bold" fill="#E8E4D8" letter-spacing="4">
    PERSONALITY REWARD EMPHASIS
  </text>
  <text x="550" y="64" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" fill="#6A6358">
    same base reward · small bias term · five distinct playstyles
  </text>

  <!-- ==== Reward dimension labels (left axis) ==== -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6A6358">
    <text x="180" y="135" text-anchor="end">push landed</text>
    <text x="180" y="185" text-anchor="end">survive time</text>
    <text x="180" y="235" text-anchor="end">block absorbed</text>
    <text x="180" y="285" text-anchor="end">dodge save</text>
    <text x="180" y="335" text-anchor="end">punish whiff</text>
    <text x="180" y="385" text-anchor="end">stamina conserve</text>
  </g>

  <!-- ==== Reward dimension axis lines ==== -->
  <g stroke="#3A3830" stroke-width="0.6" stroke-dasharray="2,3">
    <line x1="190" y1="131" x2="1060" y2="131"/>
    <line x1="190" y1="181" x2="1060" y2="181"/>
    <line x1="190" y1="231" x2="1060" y2="231"/>
    <line x1="190" y1="281" x2="1060" y2="281"/>
    <line x1="190" y1="331" x2="1060" y2="331"/>
    <line x1="190" y1="381" x2="1060" y2="381"/>
  </g>

  <!-- ==== Personality column centers (5 columns evenly spaced 190 → 1060) ==== -->
  <!-- Centers: 275, 449, 623, 797, 971 -->

  <!-- Column headers -->
  <text x="275" y="100" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="bold" fill="#E8C068" letter-spacing="2">AGGRESSIVE</text>
  <text x="449" y="100" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="bold" fill="#9AAABB" letter-spacing="2">DEFENSIVE</text>
  <text x="623" y="100" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="bold" fill="#B898CC" letter-spacing="2">EVASIVE</text>
  <text x="797" y="100" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="bold" fill="#9ABB86" letter-spacing="2">BALANCED</text>
  <text x="971" y="100" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="bold" fill="#DC9878" letter-spacing="2">COUNTER</text>

  <!-- Bar size convention: bar width represents emphasis strength.
       Track total width: 120 px per column. Each bar is centered on the column.
       Strength scale: 0 (no bar), 1 (small bar 30px), 2 (medium 60px), 3 (strong 90px), 4 (max 110px)
  -->

  <!-- ==== Helper: each bar is drawn as a rect ==== -->

  <!-- AGGRESSIVE (Amber)  pos x=275 -->
  <!-- push: 4, survive: 1, block: 1, dodge: 1, punish: 2, stamina: 1 -->
  <rect x="220" y="121" width="110" height="22" rx="3" fill="#E8C068" opacity="0.85"/>
  <rect x="260" y="171" width="30"  height="22" rx="3" fill="#E8C068" opacity="0.30"/>
  <rect x="260" y="221" width="30"  height="22" rx="3" fill="#E8C068" opacity="0.30"/>
  <rect x="260" y="271" width="30"  height="22" rx="3" fill="#E8C068" opacity="0.30"/>
  <rect x="245" y="321" width="60"  height="22" rx="3" fill="#E8C068" opacity="0.55"/>
  <rect x="260" y="371" width="30"  height="22" rx="3" fill="#E8C068" opacity="0.30"/>

  <!-- DEFENSIVE (Steel)  pos x=449 -->
  <!-- push: 1, survive: 4, block: 4, dodge: 1, punish: 2, stamina: 2 -->
  <rect x="434" y="121" width="30"  height="22" rx="3" fill="#9AAABB" opacity="0.30"/>
  <rect x="394" y="171" width="110" height="22" rx="3" fill="#9AAABB" opacity="0.85"/>
  <rect x="394" y="221" width="110" height="22" rx="3" fill="#9AAABB" opacity="0.85"/>
  <rect x="434" y="271" width="30"  height="22" rx="3" fill="#9AAABB" opacity="0.30"/>
  <rect x="419" y="321" width="60"  height="22" rx="3" fill="#9AAABB" opacity="0.55"/>
  <rect x="419" y="371" width="60"  height="22" rx="3" fill="#9AAABB" opacity="0.55"/>

  <!-- EVASIVE (Mauve)  pos x=623 -->
  <!-- push: 1, survive: 3, block: 0, dodge: 4, punish: 2, stamina: 2 -->
  <rect x="608" y="121" width="30"  height="22" rx="3" fill="#B898CC" opacity="0.30"/>
  <rect x="578" y="171" width="90"  height="22" rx="3" fill="#B898CC" opacity="0.70"/>
  <rect x="608" y="221" width="30"  height="22" rx="3" fill="#B898CC" opacity="0.15"/>
  <rect x="568" y="271" width="110" height="22" rx="3" fill="#B898CC" opacity="0.85"/>
  <rect x="593" y="321" width="60"  height="22" rx="3" fill="#B898CC" opacity="0.55"/>
  <rect x="593" y="371" width="60"  height="22" rx="3" fill="#B898CC" opacity="0.55"/>

  <!-- BALANCED (Sage)  pos x=797 -->
  <!-- push: 2, survive: 2, block: 2, dodge: 2, punish: 2, stamina: 2 -->
  <rect x="767" y="121" width="60"  height="22" rx="3" fill="#9ABB86" opacity="0.55"/>
  <rect x="767" y="171" width="60"  height="22" rx="3" fill="#9ABB86" opacity="0.55"/>
  <rect x="767" y="221" width="60"  height="22" rx="3" fill="#9ABB86" opacity="0.55"/>
  <rect x="767" y="271" width="60"  height="22" rx="3" fill="#9ABB86" opacity="0.55"/>
  <rect x="767" y="321" width="60"  height="22" rx="3" fill="#9ABB86" opacity="0.55"/>
  <rect x="767" y="371" width="60"  height="22" rx="3" fill="#9ABB86" opacity="0.55"/>

  <!-- COUNTER (Terra)  pos x=971 -->
  <!-- push: 2, survive: 2, block: 1, dodge: 2, punish: 4, stamina: 2 -->
  <rect x="941" y="121" width="60"  height="22" rx="3" fill="#DC9878" opacity="0.55"/>
  <rect x="941" y="171" width="60"  height="22" rx="3" fill="#DC9878" opacity="0.55"/>
  <rect x="956" y="221" width="30"  height="22" rx="3" fill="#DC9878" opacity="0.30"/>
  <rect x="941" y="271" width="60"  height="22" rx="3" fill="#DC9878" opacity="0.55"/>
  <rect x="916" y="321" width="110" height="22" rx="3" fill="#DC9878" opacity="0.85"/>
  <rect x="941" y="371" width="60"  height="22" rx="3" fill="#DC9878" opacity="0.55"/>

  <!-- ==== Tagline row beneath columns ==== -->
  <text x="275" y="442" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#E8C068" font-style="italic">"push first, push hard"</text>
  <text x="449" y="442" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#9AAABB" font-style="italic">"block and outlast"</text>
  <text x="623" y="442" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#B898CC" font-style="italic">"never get touched"</text>
  <text x="797" y="442" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#9ABB86" font-style="italic">"adapt to the read"</text>
  <text x="971" y="442" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#DC9878" font-style="italic">"punish whiffs"</text>

  <!-- ==== Legend ==== -->
  <text x="190" y="480" font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#6A6358">bar width = relative reward emphasis</text>

  <rect x="190" y="495" width="30"  height="14" rx="2" fill="#6A6358" opacity="0.30"/>
  <text x="228" y="506" font-family="'Segoe UI',Arial,sans-serif"
        font-size="10" fill="#6A6358">none / minimal</text>

  <rect x="335" y="495" width="60"  height="14" rx="2" fill="#6A6358" opacity="0.55"/>
  <text x="403" y="506" font-family="'Segoe UI',Arial,sans-serif"
        font-size="10" fill="#6A6358">small bias</text>

  <rect x="475" y="495" width="90"  height="14" rx="2" fill="#6A6358" opacity="0.70"/>
  <text x="573" y="506" font-family="'Segoe UI',Arial,sans-serif"
        font-size="10" fill="#6A6358">strong bias</text>

  <rect x="640" y="495" width="110" height="14" rx="2" fill="#6A6358" opacity="0.85"/>
  <text x="758" y="506" font-family="'Segoe UI',Arial,sans-serif"
        font-size="10" fill="#6A6358">defining behaviour</text>

  <!-- Footer -->
  <text x="550" y="528" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="10" fill="#4A4840">
    bias terms are 5–10% of the base win reward. small enough that the network is still mostly learning to win.
  </text>
</svg>

behaviors:
  PushmanBrain: # MUST match the "Behavior Name" in the Unity Agent inspector
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995 # Conservative, values long-term rewards like ring-outs
        strength: 1.0
    max_steps: 1000000 
    time_horizon: 128
    summary_freq: 20000


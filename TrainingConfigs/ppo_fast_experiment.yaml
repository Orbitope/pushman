# Pushman — Fast Experiment Config
# Use this to quickly sanity-check reward shaping before a full 5M-step run.
# Smaller network, no LSTM, 1M steps — completes in ~20-30min on CPU.
# NOT for production use: no memory means the agent can't read charge-up tells.
#
# Launch: mlagents-learn TrainingConfigs/ppo_fast_experiment.yaml --run-id=Pushman_Test_v1
# Then press Play in the Unity Editor.

behaviors:
  PushmanAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      use_recurrent: false

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1_000_000
    time_horizon: 64
    summary_freq: 5_000
    keep_checkpoints: 3

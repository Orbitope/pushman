# Pushman — Phase 3.9 v3: Expanded observation space (10M validation run)
#
# Trains from scratch with the v3 obs space (33 dims, was 23 in v2). The added
# 10 dims are pre-computed features the network was previously deriving (poorly):
#   - selfChargeProgress (1): push timing — derivable from LSTM but slow to learn
#   - selfRingOutMargin (1): pre-computed safety scalar
#   - opp state one-hot (6, replacing the 1-dim float): clean categorical encoding
#   - selfFacingOpponentDot (1 per opp): fixes random push/block aim (root cause
#     of v2's symptom: dodges hit reliably, pushes/blocks fired in random directions)
#   - distanceToOpponent (1 per opp): pre-computed; saves the net from learning sqrt
#   - opponentFacingSelfDot (1 per opp): predicts incoming pushes/blocks
#
# Cannot warm-start from v2/v2.5 — obs space changed (23 → 33), input layer mismatch.
#
# STRATEGY: This is a 10M-step VALIDATION run. The goal is to confirm the obs
# expansion fixes the aim symptom before committing to the full 30M-step budget.
# If aim looks correct in showcase at 10M, Phase 3.7 (self_play hardening) warm-starts
# from this checkpoint for another 20M steps. If aim is still bad, the diagnosis is
# wrong and we revisit without self-play muddying the signal.
#
# Total intended budget: 10M (v3 validation) + 20M (v3.7 self-play) = 30M.
#
# Key differences from v2:
#   - 33 obs dims (was 23) — more pre-computed features
#   - num_epoch: 5 (was 3) — value function helper (carried over from v2.5)
#   - max_steps: 10M (validation only — Phase 3.7 continues training)
#
# Launch (rebuild standalone with v3 scene first):
#   ./train.sh --standalone --config=ppo_shared_v3 --id=Pushman_Shared_v3 --force
#
# Fast-fail check during first ~3 min:
#   - Confirm "[RLAgentBrain] Player1 obs=33" in the Unity standalone log
#     (this fires from Initialize() — if you see obs=23, the standalone is stale, stop and rebuild)
#   - Confirm "Observation space size: 33" in the mlagents-learn output
#   - Confirm "Behavior name 'Pushman'"
#   - Confirm NO "Failed to load init_path" warning (training from scratch)
#
# Export after run:
#   results/Pushman_Shared_v3/Pushman/ → Assets/MLModels/Pushman_Shared/PushmanAgent_v3.onnx
#
# Validation criteria before launching Phase 3.7:
#   1. Push and block aim look intentional (not random) in Pushman/6 showcase
#   2. Entropy at 10M should be ≤ 3.5 (v2 was at 3.68 at 10M)
#   3. Episode length stable, not creeping above 200 (would indicate facing-reward dominance)

behaviors:

  Pushman:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 32768
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        memory_size: 128
        sequence_length: 64

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 20_000_000
    time_horizon: 128
    summary_freq: 20_000
    keep_checkpoints: 5

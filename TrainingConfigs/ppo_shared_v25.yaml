# Pushman — Phase 3.5: Humanization fine-tune
#
# Warm-starts from the Phase 3 v2 checkpoint (30M steps, clean obs).
# Adds noise + delay via Profile_C and discrete humanization tiers.
#
# Warm-starts from v2 checkpoint (30M steps). Obs space stays at 23 — humanization
# scalar is NOT added as an obs so the input layer shape is unchanged and init_path works.
# The noise/delay themselves create real difficulty tiers regardless; the network learns
# a single robust policy that degrades gracefully across tiers without needing to know
# which tier it is in. Per-tier policy conditioning can be added in a later fine-tune.
#
# Key differences from v2:
#   - init_path: warm-starts from the 30M v2 checkpoint
#   - num_epoch: 5 (was 3) — value function gets more gradient steps per batch;
#     v2 value loss drifted 3→10 over 30M steps; more epochs per batch closes the gap
#   - learning_rate: 1.0e-4 (was 3.0e-4) — preserve learned strategies, add robustness
#   - max_steps: 8_000_000 — warm-start needs fewer steps than training from scratch,
#     but 20 effective contexts (5 personalities × 4 humanization tiers) need coverage
#
# Launch (rebuild standalone with Profile_C scene first):
#   ./train.sh --standalone --config=ppo_shared_v25 --id=Pushman_Shared_v25 --force
#
# Fast-fail check during first ~3 min:
#   - Confirm "Observation space size: 23" (unchanged from v2)
#   - Confirm "Behavior name 'Pushman'" (single shared network)
#   - Confirm "Initializing from results/Pushman_Shared_v2/..." (no "Failed to load" warning)
#
# Export after run:
#   results/Pushman_Shared_v25/Pushman/ → Assets/MLModels/Pushman_Shared/PushmanAgent_v25.onnx

behaviors:

  Pushman:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 32768
      learning_rate: 1.0e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5        # increased from v2's 3 — helps value function keep pace

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        memory_size: 128
        sequence_length: 64

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # Warm-start from the final v2 checkpoint. Replace XXXXXX with the actual step number
    # from results/Pushman_Shared_v2/Pushman/ (should be Pushman-30000182.pt).
    init_path: results/Pushman_Shared_v2/Pushman/Pushman-30000182.pt

    max_steps: 8_000_000
    time_horizon: 128
    summary_freq: 20_000
    keep_checkpoints: 5

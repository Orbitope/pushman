# Pushman — PPO Discrete Baseline (Option A from PLAN.md)
# Fast convergence via dense reward shaping + LSTM to recognize charge-up tells.
# Action space: 4 discrete branches [3, 3, 3, 4]
# Observation space: 13 floats (Profile A, 1 opponent)
#
# Launch: mlagents-learn TrainingConfigs/ppo_discrete_baseline.yaml --run-id=Pushman_Bot_v1
# Then press Play in the Unity Editor.

behaviors:
  PushmanAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.01          # entropy coefficient — keeps exploration alive
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      memory:
        memory_size: 128
        sequence_length: 64

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 5_000_000
    time_horizon: 64
    summary_freq: 10_000
    keep_checkpoints: 5

# Pushman — SAC Continuous (Option C from PLAN.md)
# Sample-efficient off-policy training for analog (joystick-style) movement.
# Action space: 3 continuous axes (moveX, moveY, rotate) + 1 discrete branch (action button [4])
# Observation space: 13 floats (Profile A, 1 opponent)
#
# Behavior Parameters setup (must match before connecting):
#   Continuous Actions: 3
#   Discrete Branches: 1 — size 4 (none/push/block/dodge)
#
# Launch: mlagents-learn TrainingConfigs/sac_continuous.yaml --run-id=Pushman_SAC_v1
# Then press Play in the Unity Editor.

behaviors:
  PushmanAgent:
    trainer_type: sac

    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant  # SAC is off-policy; constant LR is standard
      batch_size: 256
      buffer_size: 50000               # replay buffer — larger than PPO's rollout buffer
      buffer_init_steps: 1000          # steps to fill buffer before training begins
      tau: 0.005                       # soft target network update rate
      steps_per_update: 1              # gradient steps per environment step
      save_replay_buffer: false
      init_entcoef: 0.5               # initial entropy coefficient (SAC auto-tunes this)
      reward_signal_steps_per_update: 1

    network_settings:
      normalize: true                  # normalize inputs — important for continuous control
      hidden_units: 256
      num_layers: 2
      use_recurrent: false             # SAC + LSTM is unstable; use frame stacking if memory needed

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 5_000_000
    time_horizon: 64                   # shorter than SAC's typical because episodes end on ring-out
    summary_freq: 10_000
    keep_checkpoints: 5

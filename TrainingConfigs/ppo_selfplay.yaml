# Pushman — PPO Self-Play (Option B from PLAN.md)
# Sparse rewards only — agents discover their own meta-strategies via ELO-ranked self-play.
# Run AFTER a baseline model exists; self-play from random init is very slow.
#
# Launch: mlagents-learn TrainingConfigs/ppo_selfplay.yaml --run-id=Pushman_SelfPlay_v1
# Pre-load a checkpoint: add --initialize-from=Pushman_Bot_v1

behaviors:
  PushmanAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 2.0e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      use_recurrent: true
      sequence_length: 64
      memory_size: 256

    reward_signals:
      extrinsic:
        # Only win/loss — no dense shaping. Sparse rewards force emergent tactics.
        gamma: 0.99
        strength: 1.0

    self_play:
      save_steps: 50_000
      team_change: 200_000
      swap_steps: 5_000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

    max_steps: 20_000_000
    time_horizon: 128
    summary_freq: 20_000
    keep_checkpoints: 10
